name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_mode:
        description: Choose dry-run for testing or publish to release
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected_tag"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Dry-run npm publish
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_mode != 'publish'
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_mode == 'publish')
        run: npm publish --provenance --access public
